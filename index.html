<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Bar Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="メニュー">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <h1 class="header-title">Home Bar Builder</h1>
      </div>
      <div class="header-right">
        <span class="header-label">解放済み</span>
        <span id="unlock-count" class="header-count">0</span>
        <span class="header-sep">/ <span id="total-count">20</span></span>
        <div class="progress-track">
          <div id="progress-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-inner">
        <h2 class="sidebar-title">My Bar</h2>
        <p class="sidebar-desc">持っているものにチェック</p>
        <div id="inventory-panel"></div>
      </div>
    </aside>

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main -->
    <main class="main">

      <!-- Recommendations -->
      <section id="recommendations" class="rec-section hidden">
        <h2 class="section-title">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/></svg>
          次に買うと解放されるもの
        </h2>
        <div id="recommendations-list" class="rec-grid"></div>
      </section>

      <!-- Filters -->
      <div class="filter-bar">
        <div class="filter-group">
          <button data-filter-status="all" class="filter-btn active">すべて</button>
          <button data-filter-status="unlocked" class="filter-btn"><span class="dot dot-success"></span>解放済み</button>
          <button data-filter-status="almost" class="filter-btn"><span class="dot dot-warning"></span>あと少し</button>
          <button data-filter-status="locked" class="filter-btn"><span class="dot dot-neutral"></span>ロック中</button>
        </div>
        <select id="filter-category" class="filter-select">
          <option value="all">全カテゴリ</option>
          <option value="short">ショート</option>
          <option value="long">ロング</option>
          <option value="tropical">トロピカル</option>
          <option value="standard">スタンダード</option>
          <option value="shot">ショット</option>
          <option value="hot">ホット</option>
          <option value="non-alcohol">ノンアルコール</option>
        </select>
        <select id="filter-method" class="filter-select">
          <option value="all">全技法</option>
          <option value="shake">シェーク</option>
          <option value="stir">ステア</option>
          <option value="build">ビルド</option>
          <option value="blend">ブレンド</option>
          <option value="layer">レイヤー</option>
        </select>
      </div>

      <!-- Cocktail Grid -->
      <div id="cocktail-grid" class="cocktail-grid"></div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <p class="empty-icon">🍸</p>
        <p class="empty-text">フィルターに一致するカクテルがありません</p>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div id="modal" class="modal-backdrop hidden">
    <div id="modal-overlay" class="modal-scrim"></div>
    <div id="modal-content" class="modal-content"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
