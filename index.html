<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Home Bar Builder</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== Tab: My Bar ===== -->
  <div id="tab-mybar" class="tab-page active">
    <header class="tab-header">
      <h1 class="tab-header-title">My Bar</h1>
      <p class="tab-header-sub">持っているお酒にチェック</p>
    </header>
    <div class="tab-body">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-inventory" type="text" class="search-input" placeholder="ボトルを検索...">
        <button id="search-inventory-clear" class="search-clear hidden" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="mybar-stats">
        <div class="mybar-stat">
          <span class="mybar-stat-num" id="stat-bottles">0</span>
          <span class="mybar-stat-label">ボトル</span>
        </div>
        <div class="mybar-stat">
          <span class="mybar-stat-num" id="stat-unlocked">0</span>
          <span class="mybar-stat-label">作れる杯</span>
        </div>
      </div>
      <div id="inventory-panel"></div>
    </div>
  </div>

  <!-- ===== Tab: Cocktails ===== -->
  <div id="tab-cocktails" class="tab-page">
    <header class="tab-header">
      <h1 class="tab-header-title">カクテル</h1>
      <div class="tab-header-progress">
        <span id="unlock-count" class="progress-num">0</span>
        <span class="progress-sep">/ <span id="total-count">0</span></span>
        <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
      </div>
    </header>
    <div class="tab-body">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-cocktails" type="text" class="search-input" placeholder="カクテル名で検索...">
        <button id="search-cocktails-clear" class="search-clear hidden" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="filter-bar">
        <div class="filter-group">
          <button data-filter-status="all" class="filter-btn active">すべて</button>
          <button data-filter-status="unlocked" class="filter-btn"><span class="dot dot-success"></span>作れる</button>
          <button data-filter-status="almost" class="filter-btn"><span class="dot dot-warning"></span>あと少し</button>
          <button data-filter-status="locked" class="filter-btn"><span class="dot dot-neutral"></span>ロック</button>
        </div>
        <div class="filter-selects">
          <select id="filter-category" class="filter-select">
            <option value="all">全カテゴリ</option>
            <option value="short">ショート</option>
            <option value="long">ロング</option>
            <option value="tropical">トロピカル</option>
            <option value="standard">スタンダード</option>
            <option value="shot">ショット</option>
            <option value="hot">ホット</option>
            <option value="non-alcohol">ノンアル</option>
          </select>
          <select id="filter-method" class="filter-select">
            <option value="all">全技法</option>
            <option value="shake">シェーク</option>
            <option value="stir">ステア</option>
            <option value="build">ビルド</option>
            <option value="blend">ブレンド</option>
            <option value="layer">レイヤー</option>
          </select>
        </div>
      </div>
      <div id="cocktail-grid" class="cocktail-grid"></div>
      <div id="empty-state" class="empty-state hidden">
        <p class="empty-icon">🍸</p>
        <p class="empty-text">フィルターに一致するカクテルがありません</p>
      </div>
    </div>
  </div>

  <!-- ===== Tab: Recommend ===== -->
  <div id="tab-recommend" class="tab-page">
    <header class="tab-header">
      <h1 class="tab-header-title">おすすめ</h1>
      <p class="tab-header-sub">次に買うと作れるカクテルが増えます</p>
    </header>
    <div class="tab-body">
      <div id="recommendations-list" class="rec-list"></div>
      <div id="rec-empty" class="empty-state hidden">
        <p class="empty-icon">🎉</p>
        <p class="empty-text">すべてのカクテルが作れます！</p>
      </div>
    </div>
  </div>

  <!-- ===== Tab: Guide ===== -->
  <div id="tab-guide" class="tab-page">
    <header class="tab-header">
      <h1 class="tab-header-title">ガイド</h1>
      <p class="tab-header-sub">器具の使い方とカクテル技法</p>
    </header>
    <div class="tab-body">
      <div id="guide-panel"></div>
    </div>
  </div>

  <!-- ===== Detail Modal ===== -->
  <div id="modal" class="modal-backdrop hidden">
    <div id="modal-overlay" class="modal-scrim"></div>
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- ===== Bottom Tab Bar ===== -->
  <nav class="tab-bar">
    <button class="tab-bar-btn active" data-tab="mybar">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>My Bar</span>
    </button>
    <button class="tab-bar-btn" data-tab="cocktails">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M8 2l1.5 9H14l1.5-9"/><path d="M12 11v9"/><path d="M8 20h8"/><path d="M6 2h12"/></svg>
      <span>カクテル</span>
    </button>
    <button class="tab-bar-btn" data-tab="recommend">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
      <span>おすすめ</span>
    </button>
    <button class="tab-bar-btn" data-tab="guide">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      <span>ガイド</span>
    </button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
